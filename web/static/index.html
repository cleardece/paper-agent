<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Agent</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">P</span><span>Paper Agent</span></div>
      <p class="sidebar-caption">可追溯的研究工作台</p>
      <button id="newChat" class="new-chat">+ 新建对话</button>
      <button id="uploadBtn" class="upload-btn">选择本地 PDF</button>
      <input type="file" id="fileInput" accept=".pdf" multiple style="display:none">
      <div id="uploadStatus" class="upload-status" style="display:none"></div>
      <details id="uploadDraftPanel" class="upload-batch-panel" style="display:none">
        <summary>待上传清单</summary>
        <div id="uploadDraftSummary" class="upload-batch-summary"></div>
        <div id="uploadDraftFiles" class="upload-batch-jobs"></div>
        <button id="startUploadBtn" class="start-upload-btn" type="button" disabled>开始上传（0 篇）</button>
      </details>
      <details id="uploadBatchPanel" class="upload-batch-panel" style="display:none">
        <summary>本批上传</summary>
        <div id="uploadBatchSummary" class="upload-batch-summary"></div>
        <div id="uploadBatchJobs" class="upload-batch-jobs"></div>
      </details>
      <details id="recentUploadBatches" class="upload-batch-panel" style="display:none">
        <summary>近 7 天批次</summary>
        <div id="recentUploadBatchList" class="upload-batch-jobs"></div>
      </details>
      <div id="uploadRefreshWarning" class="upload-refresh-warning" style="display:none"></div>
      <a href="/papers" class="library-link">浏览论文库</a>
      <div id="sessions" class="sessions"></div>
    </aside>

    <main class="chat-shell">
      <header class="topbar">
        <div class="workspace-title">
          <span class="eyebrow">研究工作台</span>
          <strong id="chatTitle">新对话</strong>
          <span id="connectionState" class="connection-state">准备就绪</span>
        </div>
        <button id="themeToggle" class="icon-button" type="button" aria-label="切换深浅主题" title="切换深浅主题">◐</button>
      </header>

      <section id="messages" class="messages"></section>

      <form id="composer" class="composer">
        <textarea id="messageInput" rows="1" placeholder="询问论文、检索主题或要求入库..."></textarea>
        <button id="sendButton" type="submit">发送</button>
      </form>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
